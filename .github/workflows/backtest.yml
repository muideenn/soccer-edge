name: Weekly backtest

on:
  schedule:
    - cron: "41 5 * * 1"        # Mondays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('fetch_data.sh') }}
      - run: ./fetch_data.sh
      - run: python -m soccer_edge.cli backtest
      - run: python -m soccer_edge.cli corners-eval
      - run: python -m soccer_edge.cli export
      - name: Commit results
        run: |
          git config user.name "soccer-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/*.csv outputs/*.json outputs/*.png outputs/backtest_results.pkl web/public/data
          git diff --cached --quiet || git commit -m "backtest: weekly refresh $(date -u +%Y-%m-%d)"
          git push
